spring.application.name=payment_service
server.port=8083

# =========================================================
# PostgreSQL
# Supports AWS ECS secrets injection (test_db_url, username, password)
# with fallback to PAYMENT_DB_* for Docker Compose and local development.
# =========================================================
spring.datasource.url=${test_db_url:${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_service}}
spring.datasource.username=${username:${PAYMENT_DB_USERNAME:postgres}}
spring.datasource.password=${password:${PAYMENT_DB_PASSWORD:}}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Existing installations used Hibernate schema updates. Baseline them at zero
# so the idempotency migration also runs against their existing payments table.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Booking Service connectivity (used to validate bookings / fetch fare).
# Compose sets BOOKING_SERVICE_URL=http://booking-service:8082.
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8082}

# Payment gateway: SANDBOX (default, safe for local development) or RAZORPAY.
# All credentials must come from environment variables - never commit them.
payment.provider=${PAYMENT_PROVIDER:SANDBOX}
payment.currency=${PAYMENT_CURRENCY:INR}
payment.recovery.enabled=${PAYMENT_RECOVERY_ENABLED:true}
payment.recovery.interval-ms=${PAYMENT_RECOVERY_INTERVAL_MS:10000}

payment.provider.razorpay.key.id=${RAZORPAY_KEY_ID:}
payment.provider.razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
payment.provider.razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Actuator - expose only the health endpoint required for monitoring.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# =========================================================
# Kafka Configuration
# Supports AWS MSK Serverless SASL/IAM, SASL/SCRAM, and local PLAINTEXT
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}
spring.kafka.properties.sasl.client.callback.handler.class=${KAFKA_SASL_CALLBACK_HANDLER:software.amazon.msk.auth.iam.IAMClientCallbackHandler}

# Rate Limiting
app.ratelimit.api.capacity=60
app.ratelimit.api.refill-seconds=60
app.ratelimit.initiate.capacity=20
app.ratelimit.initiate.refill-seconds=60
